    - region "A simple guide" [ref=e201]:
      - generic [ref=e202]: How to Pray
      - generic [ref=e203]:
        - generic [ref=e204]:
          - heading "A simple guide" [level=2] [ref=e205]
          - paragraph [ref=e206]: The structure is simple. The depth comes from remaining with the mysteries of Christ.
        - list [ref=e207]:
          - listitem [ref=e208]:
            - strong [ref=e209]: Begin with the Sign of the Cross.
            - text: In the name of the Father, and of the Son, and of the Holy Spirit. Amen.
          - listitem [ref=e210]:
            - strong [ref=e211]: Pray the Apostles' Creed.
            - text: This places the Rosary inside the faith of the Church.
          - listitem [ref=e212]:
            - strong [ref=e213]: Pray one Our Father.
            - text: The prayer Jesus Himself taught us.
          - listitem [ref=e214]:
            - strong [ref=e215]: Pray three Hail Marys.
            - text: Traditionally offered for faith, hope, and charity.
          - listitem [ref=e216]:
            - strong [ref=e217]: Pray the Glory Be.
            - text: Praise the Holy Trinity.
          - listitem [ref=e218]:
            - strong [ref=e219]: Announce the first mystery.
            - text: Pause, imagine the scene, and ask for the fruit of the mystery.
          - listitem [ref=e220]:
            - strong [ref=e221]: Pray one Our Father, ten Hail Marys, and one Glory Be.
            - text: Let the words become steady, humble, and contemplative.
          - listitem [ref=e222]:
            - strong [ref=e223]: Repeat for all five mysteries.
            - text: Each decade is a step through the Gospel.
          - listitem [ref=e224]:
            - strong [ref=e225]: Conclude with the Hail Holy Queen.
            - text: Entrust yourself to Mary's maternal intercession.
      - generic [ref=e226]:
        - heading "How to pray it better" [level=3] [ref=e227]
        - paragraph [ref=e228]: Do not rush. Before each decade, pause and name the mystery. Read or remember one short Scripture passage. Ask for the fruit of the mystery. Picture the scene. When distraction comes, gently return.
        - paragraph [ref=e229]: The Rosary is not about perfect feelings. It is about faithful presence.
        - group [ref=e230]:
          - generic "For distraction" [ref=e231] [cursor=pointer]
    - region "The prayer took shape over time" [ref=e232]:
      - generic [ref=e233]: Chronology
      - generic [ref=e234]:
        - generic [ref=e235]:
          - heading "The prayer took shape over time" [level=2] [ref=e236]
          - paragraph [ref=e237]: The exhibit distinguishes roots, tradition, papal framing, shrine testimony, and later devotional memory.
        - generic [ref=e238]:
          - article [ref=e239]:
            - generic [ref=e240]: 3rd c.
            - generic [ref=e241]:
              - generic [ref=e242]: Early roots
              - heading "Counted prayer enters Christian practice" [level=3] [ref=e243]
              - paragraph [ref=e244]: Counted prayer among early Christians prepared the way for later bead-based devotion. The Rosary was not fixed yet, but the habit of measuring prayer with the body was already alive.
          - article [ref=e245]:
            - img "Portrait of Saint Dominic" [ref=e246]
            - generic [ref=e247]: 13th c.
            - generic [ref=e248]:
              - generic [ref=e249]: Dominican tradition
              - heading "The devotion gathers around preaching" [level=3] [ref=e250]
              - paragraph [ref=e251]: Catholic tradition associates the Rosary with Saint Dominic and the Dominican family. The historical record is gradual, but the Dominican story gave the devotion a preaching-shaped public form.
          - article [ref=e252]:
            - generic [ref=e253]: 15th c.
            - generic [ref=e254]:
              - generic [ref=e255]: Psalter of Mary
              - heading "The prayer reaches a settled form" [level=3] [ref=e256]
              - paragraph [ref=e257]: The devotion became recognizable as a set of repeated Hail Marys grouped around sacred mysteries, echoing the 150 Psalms in a prayer ordinary Catholics could carry.
          - article [ref=e258]:
            - img "Portrait of Pope Pius V" [ref=e259]
            - generic [ref=e260]: "1569"
            - generic [ref=e261]:
              - generic [ref=e262]: Pius V
              - heading "Rome gives the prayer clearer shape" [level=3] [ref=e263]
              - paragraph [ref=e264]: Pope Pius V described the traditional form of the Rosary, giving the devotion a clearer public frame within the Church's life.
          - article [ref=e265]:
            - generic [ref=e266]: 1571-1573
            - generic [ref=e267]:
              - generic [ref=e268]: Lepanto and feast
              - heading "A battle remembered through prayer" [level=3] [ref=e269]
              - paragraph [ref=e270]: The Battle of Lepanto became tied to Catholic memory of Rosary prayer and gratitude. The feast of Our Lady of the Rosary grew from this devotional remembrance.
