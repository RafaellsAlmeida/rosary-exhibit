    - region "A compendium of the Gospel" [ref=e156]:
      - generic [ref=e157]: What Is the Rosary?
      - generic [ref=e158]:
        - generic [ref=e159]:
          - heading "A compendium of the Gospel" [level=2] [ref=e160]
          - group [ref=e161]:
            - generic "Quiet distinction" [ref=e162] [cursor=pointer]
        - generic [ref=e163]:
          - paragraph [ref=e164]: The Rosary is a meditative Catholic prayer centered on the life, death, and glory of Jesus Christ.
          - paragraph [ref=e165]: "Each decade invites us to contemplate one mystery from the Gospel: the Annunciation, the Nativity, the Baptism of Jesus, the Crucifixion, the Resurrection, Pentecost, and many others."
          - paragraph [ref=e166]: The Church has often called the Rosary a compendium of the Gospel because it gathers the central events of salvation history into a prayer that can be carried in the hand, prayed in the home, whispered in suffering, or proclaimed in procession.
          - paragraph [ref=e167]: The Rosary is Marian because we pray it with Mary. It is Christ-centered because every mystery leads us to Jesus.
    - region "To rediscover the Rosary with faith and clarity" [ref=e168]:
      - generic [ref=e169]: Why This Exhibition Exists
      - generic [ref=e170]:
        - heading "To rediscover the Rosary with faith and clarity" [level=2] [ref=e171]
        - paragraph [ref=e172]: Many Catholics know the Rosary as a family tradition. Some know it as a daily devotion. Others see it as repetitive and do not yet understand its depth.
      - generic [ref=e173]:
        - generic [ref=e174]: A prayer of contemplation
        - generic [ref=e175]: A school of holiness
        - generic [ref=e176]: A weapon for peace
        - generic [ref=e177]: A guide through the Gospel
        - generic [ref=e178]: A devotion loved by popes, saints, shrines, and families
        - generic [ref=e179]: A prayer connected to conversion, healing, protection, and hope
      - generic [ref=e180]:
        - paragraph [ref=e181]: This exhibition does not treat every miracle story the same way. Some events are official Church teaching. Some are shrine-documented testimonies. Some are devotional traditions. Some are popular stories that need more evidence.
        - strong [ref=e182]: Faith does not require exaggeration. The truth is already beautiful enough.
        - group [ref=e183]:
          - generic "Source discipline" [ref=e184] [cursor=pointer]
