    - region "Can prayer affect the body?" [ref=e679]:
      - generic [ref=e680]: Science and Well-Being
      - generic [ref=e681]:
        - heading "Can prayer affect the body?" [level=2] [ref=e683]
        - generic [ref=e684]:
          - paragraph [ref=e685]: Science cannot prove grace. It cannot measure the intercession of Mary. It cannot reduce prayer to a biological technique.
          - paragraph [ref=e686]: But science can observe certain human effects of prayer. Some studies suggest that repetitive prayer, including the Rosary, may support slower breathing, greater calm, emotional regulation, coping, and spiritual well-being.
