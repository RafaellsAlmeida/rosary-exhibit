    - region "Shrines where the Rosary stayed close to the message" [ref=e579]:
      - generic [ref=e580]: Mary and the Rosary
      - heading "Shrines where the Rosary stayed close to the message" [level=2] [ref=e581]
      - generic [ref=e582]:
        - article [ref=e583]:
          - img "Historical photograph of the three children of Fatima" [ref=e584]
          - generic [ref=e585]: Approved shrine tradition
          - 'heading "Fatima: pray the Rosary every day" [level=3] [ref=e586]'
          - paragraph [ref=e587]: "In 1917, Our Lady appeared to three shepherd children in Fatima, Portugal. Her message was urgent: conversion, repentance, prayer, sacrifice, and peace. Again and again, she asked for the daily Rosary."
          - paragraph [ref=e588]: Pray. Repent. Offer sacrifices. Turn toward God. Pray the Rosary for peace.
          - group [ref=e589]:
            - generic "Why this anchors the site" [ref=e590] [cursor=pointer]
        - article [ref=e591]:
          - img "Portrait of Saint Bernadette Soubirous" [ref=e592]
          - generic [ref=e593]: Approved shrine tradition
          - 'heading "Lourdes: the Rosary at the Grotto" [level=3] [ref=e594]'
          - paragraph [ref=e595]: When Saint Bernadette encountered the Lady at Lourdes, she prayed the Rosary. Lourdes reminds us that the Rosary is not only a prayer of words. It is a prayer of presence.
          - paragraph [ref=e596]: The shrine also maintains a serious process for examining alleged healings, joining devotion with careful discernment.
        - article [ref=e597]:
          - img "Portrait of Blessed Bartolo Longo" [ref=e598]
          - generic [ref=e599]: Biographical witness
          - 'heading "Pompeii: the Rosary and conversion" [level=3] [ref=e600]'
          - paragraph [ref=e601]: Blessed Bartolo Longo was once far from the Catholic faith. His life was transformed, and he became one of the great apostles of the Rosary.
          - paragraph [ref=e602]: His story shows that the Rosary is also for the lost, the wounded, the confused, and the returning.
        - article [ref=e603]:
          - img "Statue of Our Lady of Kibeho" [ref=e604]
          - generic [ref=e605]: Approved shrine tradition
          - 'heading "Kibeho: repentance and the Seven Sorrows" [level=3] [ref=e606]'
          - paragraph [ref=e607]: At Kibeho in Rwanda, the Marian message emphasized conversion, repentance, suffering, and prayer. The Rosary of the Seven Sorrows became especially important in that spiritual tradition.
          - paragraph [ref=e608]: Kibeho reminds us that Marian devotion is not sentimental. Mary calls her children to repentance and deep conversion.
    - region "Lives shaped by the Rosary" [ref=e609]:
      - generic [ref=e610]: Saints and Witnesses
      - generic [ref=e611]:
        - heading "Lives shaped by the Rosary" [level=2] [ref=e612]
        - paragraph [ref=e613]: The Rosary has been preached, defended, loved, and carried by saints, popes, shrines, families, and ordinary souls.
      - generic [ref=e614]:
        - article [ref=e615]:
          - img "Portrait of Saint Dominic" [ref=e616]
          - heading "Saint Dominic and the Dominican tradition" [level=3] [ref=e617]
          - paragraph [ref=e618]: The Rosary has long been associated with preaching, contemplation, and teaching the Gospel to ordinary people.
        - article [ref=e619]:
          - img "Portrait of Saint Louis de Montfort" [ref=e620]
          - heading "Saint Louis de Montfort" [level=3] [ref=e621]
          - paragraph [ref=e622]: For de Montfort, the Rosary was a path of conversion, perseverance, and union with Jesus through Mary.
        - article [ref=e623]:
          - img "Portrait of Pope Leo XIII" [ref=e624]
          - heading "Pope Leo XIII" [level=3] [ref=e625]
          - paragraph [ref=e626]: Leo XIII wrote extensively on the Rosary and helped shape modern papal teaching on it as a response to crises in society, family, and the Church.
        - article [ref=e627]:
          - img "Photograph of Saint John Paul II" [ref=e628]
          - heading "Saint John Paul II" [level=3] [ref=e629]
          - paragraph [ref=e630]: In Rosarium Virginis Mariae, John Paul II described the Rosary as contemplating Christ with Mary and gave the Church the Luminous Mysteries.
        - article [ref=e631]:
