<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Rosary Exhibit Icon</title>
  <desc id="desc">A simple gold rosary bead on a dark background.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a2431" />
      <stop offset="100%" stop-color="#091018" />
    </radialGradient>
    <radialGradient id="bead" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff5d8" />
      <stop offset="42%" stop-color="#f3d99a" />
      <stop offset="100%" stop-color="#b98b3c" />
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#bg)" />
  <circle cx="32" cy="32" r="17" fill="none" stroke="#f3d99a" stroke-opacity="0.28" stroke-dasharray="2 4" />
  <circle cx="32" cy="32" r="10" fill="url(#bead)" />
  <circle cx="28" cy="28" r="3.2" fill="#ffffff" fill-opacity="0.42" />
</svg>
